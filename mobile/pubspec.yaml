name: midori
description: "Midori — AI-powered plant disease detection. Upload a leaf photo, get an instant two-stage diagnosis with Grad-CAM visualisation, confidence scores, cause, remedy, and treatment advice."
publish_to: "none"

version: 1.2.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # ── State & DI ──────────────────────────────────────────────────────────────
  flutter_riverpod: ^3.3.1

  # ── Networking ───────────────────────────────────────────────────────────────
  http: ^1.2.2

  # ── Local storage ────────────────────────────────────────────────────────────
  shared_preferences: ^2.5.5

  # ── Image picking ────────────────────────────────────────────────────────────
  image_picker: ^1.2.1
  permission_handler: ^11.4.0

  # ── UI ───────────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # No bundled assets needed — all inference happens server-side.
